services:
  - type: web
    name: mirsad-free
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 4h
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
